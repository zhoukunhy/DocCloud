# RocketMQ Broker 配置（开发环境单机）
# brokerIP1 必须是宿主机可达地址：服务运行在宿主机，通过映射端口 10911 连接
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
namesrvAddr = rocketmq-namesrv:9876

# 开发环境自动创建 Topic / 消费组，免手动建 Topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroupEnable = true

# 磁盘清理策略：凌晨 4 点，保留 48 小时
deleteWhen = 04
fileReservedTime = 48

# 异步主节点 + 异步刷盘（性能优先，开发环境够用）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
