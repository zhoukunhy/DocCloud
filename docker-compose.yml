# =====================================================================
# DocCloud 中间件一键部署（阶段6）
# 用法：docker compose up -d
# 模式：服务在宿主机本地运行，中间件容器化，所有端口映射到 127.0.0.1
# 地址与 doc-cloud-backend 各服务 application.yml / bootstrap.yml 一一对应：
#   MySQL 127.0.0.1:3306 (root/root)  Redis 127.0.0.1:6379(无密码)
#   Nacos 127.0.0.1:8848/9848  RocketMQ 127.0.0.1:9876
#   ES 127.0.0.1:9200  MinIO 127.0.0.1:9000/9001 (minioadmin/minioadmin)
# =====================================================================
name: doccloud

services:
  mysql:
    image: mysql:8.0.36
    container_name: doccloud-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表 SQL（4 库 7 表，见阶段4交付物）
      - ./doc-cloud-backend/sql/doc-cloud-init.sql:/docker-entrypoint-initdb.d/doc-cloud-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doccloud-net

  redis:
    image: redis:7.2-alpine
    container_name: doccloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doccloud-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: doccloud-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"   # 控制台 & HTTP API
      - "9848:9848"   # gRPC 客户端端口（2.x 必须，偏移+1000）
    environment:
      TZ: Asia/Shanghai
      MODE: standalone            # 单机模式，DERBY 内嵌存储
      NACOS_AUTH_ENABLE: "false"  # 开发环境关闭鉴权
      JVM_XMS: 256m
      JVM_XMX: 256m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - doccloud-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: doccloud-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    networks:
      - doccloud-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: doccloud-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    # broker.conf 中 brokerIP1=127.0.0.1：宿主机服务通过映射端口 10911 连接
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10909:10909"  # VIP 通道
      - "10911:10911"  # 主端口
      - "10912:10912"  # HA 端口
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./doc-cloud-backend/docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    networks:
      - doccloud-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: doccloud-es
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "false"   # 开发环境关闭安全认证
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - doccloud-net

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: doccloud-minio
    restart: unless-stopped
    # 9000 API 端口 / 9001 控制台
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - doccloud-net

networks:
  doccloud-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  es-data:
  minio-data:
